<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cera Playground</title>
<style>
  :root { color-scheme: dark; --bg:#0e0f12; --panel:#16181d; --line:#2a2d35; --fg:#e6e6e6; --dim:#8b909a; --acc:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,Menlo,Consolas,monospace; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; }
  button, select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 12px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:var(--acc); }
  button.run { background:var(--acc); color:#0b0c0f; border-color:var(--acc); font-weight:600; }
  main { flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0; }
  @media (max-width:800px) { main { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } }
  .col { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  .col:last-child { border-right:0; }
  label { padding:6px 14px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); }
  textarea, pre { flex:1; margin:0; padding:12px 14px; background:var(--panel); color:var(--fg); border:0; resize:none; font:inherit; outline:none; overflow:auto; white-space:pre; tab-size:2; }
  #stdin { flex:0 0 70px; border-top:1px solid var(--line); }
  pre.err { color:#ff8a8a; flex:0 0 auto; max-height:45%; border-top:1px solid var(--line); }
  pre.err:empty { display:none; }
  #status { margin-left:auto; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Cera</h1>
  <button class="run" id="run">Run</button>
  <button id="check">Check</button>
  <button id="fmt">Format</button>
  <select id="examples"></select>
  <span id="status">loading wasm...</span>
</header>
<main>
  <div class="col">
    <label>main.cera (Ctrl/Cmd+Enter to run)</label>
    <textarea id="src" spellcheck="false"></textarea>
    <label>stdin</label>
    <textarea id="stdin" spellcheck="false"></textarea>
  </div>
  <div class="col">
    <label>output</label>
    <pre id="out"></pre>
    <pre id="err" class="err"></pre>
  </div>
</main>
<script id="examples-data" type="application/json">{"guessing_game": "## The guessing game from the Rust book, in Cera.\n##\n##   cerac run examples/guessing_game.cera\n##\n## The computer picks a number from 1 to 100; you guess until you get it.\nimport std.io\nimport std.time\nimport std.bits\n\n## A pseudo-random number in 1..=100 from a seed (a linear congruential step).\nsecret_from :: fn(seed: u64) -> i64 do\n  mixed = bits.wrapping_add(bits.wrapping_mul(seed, 6364136223846793005), 1442695040888963407)\n  roll = bits.shr(mixed, 33) % 100\n  Option.unwrap_or(Num.to_i64(roll), 0) + 1\nend\n\n## Ask until the player gives a number; `None` means the input ended.\nread_guess :: fn() -> Option<i64> do\n  io.print(\"Please input your guess: \")\n  match io.read_line() do\n    None -> None\n    Some(line) ->\n      match String.parse_i64(String.trim(line)) do\n        Some(n) -> Some(n)\n        None -> do\n          io.println(\"Please type a number!\")\n          read_guess()\n        end\n      end\n  end\nend\n\nplay :: fn(secret: i64, tries: i32) do\n  match read_guess() do\n    None -> io.println(\"Goodbye!\")\n    Some(guess) -> do\n      io.println(String.concat([\"You guessed: \", show(guess)]))\n      match compare(guess, secret) do\n        Less -> do\n          io.println(\"Too small!\")\n          play(secret, tries + 1)\n        end\n        Greater -> do\n          io.println(\"Too big!\")\n          play(secret, tries + 1)\n        end\n        Equal -> io.println(String.concat([\"You win, in \", show(tries), \" tries!\"]))\n      end\n    end\n  end\nend\n\nmain :: fn(caps: Caps) do\n  seed = Option.unwrap_or(Num.to_u64(time.now_ms(caps.clock)), 1)\n  io.println(\"Guess the number!\")\n  play(secret_from(seed), 1)\nend\n", "hello": "import std.io\n\nmain :: fn() do\n  \"Hello, world!\" |> io.println\nend\n", "loops": "import std.io\nimport std.list\n\nsum_to :: fn(n: i64) -> i64 do\n  var total = 0\n  var i = 1\n  while i <= n do\n    total := total + i\n    i := i + 1\n  end\n  total\nend\n\nevens :: fn(xs: [i64]) -> i64 do\n  var acc = 0\n  for x in xs do\n    if x % 2 != 0 do\n      continue\n    end\n    if x > 20 do\n      break\n    end\n    acc := acc + x\n  end\n  acc\nend\n\nnested :: fn() -> i64 do\n  var count = 0\n  for a in list.range(0, 5) do\n    var b = 0\n    while true do\n      b := b + 1\n      if b > a do\n        break\n      end\n      count := count + 1\n    end\n  end\n  count\nend\n\nmain :: fn() do\n  io.println(sum_to(100))\n  io.println(evens(list.range(0, 100)))\n  io.println(nested())\n  var words = [\"a\", \"b\", \"c\"]\n  var n = 0\n  for w in words do\n    io.println(w)\n    n := n + 1\n  end\n  io.println(n)\nend\n", "shapes": "import std.io\n\nShape :: type\n  | Circle(r: f64)\n  | Rect(w: f64, h: f64)\nend\n\narea :: fn(s: Shape) -> f64 do\n  match s do\n    Circle(r)  -> 3.14159 * r * r\n    Rect(w, h) -> w * h\n  end\nend\n\nmain :: fn() do\n  region do\n    shapes = [Circle(2.0), Rect(3.0, 4.0)]\n    shapes\n      |> map(area)\n      |> sum\n      |> io.println\n  end\nend\n", "traits": "import std.io\n\nShape :: type\n  | Circle(r: f64)\n  | Rect(w: f64, h: f64)\nend\n\nArea :: trait\n  area :: fn(self) -> f64\nend\n\nimpl Area for Shape do\n  area :: fn(s: Shape) -> f64 do\n    match s do\n      Circle(r)  -> 3.14159 * r * r\n      Rect(w, h) -> w * h\n    end\n  end\nend\n\nimpl Show for Shape do\n  show :: fn(s: Shape) -> String do\n    match s do\n      Circle(_)  -> \"circle\"\n      Rect(_, _) -> \"rectangle\"\n    end\n  end\nend\n\ntotal :: fn<T: Area>(xs: [T]) -> f64 do\n  match xs do\n    [] -> 0.0\n    [x | rest] -> area(x) + total(rest)\n  end\nend\n\nmain :: fn() do\n  shapes = [Circle(1.0), Rect(2.0, 3.0)]\n  io.println(shapes)\n  io.println(total(shapes))\nend\n"}</script>

    return __wbg_init_promise;
}

async function __wbg_init_once(module_or_path) {

    if (module_or_path !== undefined) {
        if (Object.getPrototypeOf(module_or_path) === Object.prototype) {
            ({module_or_path} = module_or_path)
        } else {
            console.warn('using deprecated parameters for the initialization function; pass a single object instead')
        }
    }

    if (module_or_path === undefined) {
        module_or_path = new URL('cera_wasm_bg.wasm', import.meta.url);
    }
    const imports = __wbg_get_imports();

    if (typeof module_or_path === 'string' || (typeof Request === 'function' && module_or_path instanceof Request) || (typeof URL === 'function' && module_or_path instanceof URL)) {
        module_or_path = fetch(module_or_path);
    }

    const { instance, module } = await __wbg_load(await module_or_path, imports);

    return __wbg_finalize_init(instance, module);
}



const $ = id => document.getElementById(id);
const status = t => $("status").textContent = t;

let examples = {};
examples = JSON.parse(document.getElementById('examples-data').textContent);
const sel = $("examples");
for (const name of Object.keys(examples)) sel.add(new Option(name, name));
const initial = location.hash.slice(1) ? decodeURIComponent(atob(location.hash.slice(1))) : null;
$("src").value = initial ?? examples.hello ?? 'import std.io\n\nmain :: fn() do\n  io.println("Hello, world!")\nend\n';
sel.value = examples.hello ? "hello" : "";
sel.onchange = () => { $("src").value = examples[sel.value]; $("out").textContent = $("err").textContent = ""; };

const gz = Uint8Array.from(atob(document.getElementById('wasm-data').textContent), c => c.charCodeAt(0));
const rawWasm = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
await __wbg_init({ module_or_path: rawWasm });
status("ready");

function show(out, err) { $("out").textContent = out; $("err").textContent = err; }
function share() { try { history.replaceState(null, "", "#" + btoa(encodeURIComponent($("src").value))); } catch {} }

$("run").onclick = () => {
  const t = performance.now();
  const r = run($("src").value, $("stdin").value);
  show(r.out, r.err);
  status(`${r.ok ? "exit " + r.code : "failed"} in ${(performance.now() - t).toFixed(0)} ms`);
  share();
};
$("check").onclick = () => {
  const d = check($("src").value);
  show("", d);
  status(d ? "errors" : "no errors");
};
$("fmt").onclick = () => {
  const f = format($("src").value);
  if (f.startsWith("error: ")) { show("", f); status("format failed"); }
  else { $("src").value = f; status("formatted"); }
};
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("run").click(); } });
</script>
